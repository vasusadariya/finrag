name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finrag
          POSTGRES_PASSWORD: finrag
          POSTGRES_DB: finrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finrag" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://finrag:finrag@localhost:5432/finrag
      FINRAG_REQUIRE_DB: "1"
      # DATABASE_URL etc. are needed by Settings-based tests; no LLM key: live tests skip
      DATABASE_URL: postgresql://finrag:finrag@localhost:5432/finrag
      DATABASE_URL_RO: postgresql://finrag_ro:finrag_ro@localhost:5432/finrag
      EDGAR_USER_AGENT: "FinRAG CI ci@example.com"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-go@v5
        with:
          go-version-file: sqlguard-go/go.mod
          cache-dependency-path: sqlguard-go/go.sum
      - name: "Install (no torch, so model tests skip)"
        working-directory: backend
        run: uv sync --frozen
      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Tests (the SQL guard binary is built by the test fixture)
        working-directory: backend
        run: uv run pytest -q

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finrag
          POSTGRES_PASSWORD: finrag
          POSTGRES_DB: finrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finrag" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://finrag:finrag@localhost:5432/finrag?sslmode=disable
    strategy:
      matrix:
        module: [ingest-go, sqlguard-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ matrix.module }}
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./... -race -count=1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: E2E (API mocked at the network layer)
        run: npm run e2e

  docker:
    runs-on: ubuntu-latest
    needs: [backend, go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images (not pushed)
        run: |
          docker buildx build -f sqlguard-go/Dockerfile -t finrag-sqlguard .
          docker buildx build -f backend/Dockerfile -t finrag-backend .
          docker buildx build -t finrag-web frontend
      - name: Compose smoke test
        env:
          EDGAR_USER_AGENT: "FinRAG CI ci@example.com"
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            curl -fsS localhost:3000/api/health && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
