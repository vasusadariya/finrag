repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: make lint-go
        language: system
        pass_filenames: false
        files: \.go$
