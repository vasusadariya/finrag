services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finrag
      POSTGRES_PASSWORD: finrag
      POSTGRES_DB: finrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrag -d finrag"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
