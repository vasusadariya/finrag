[project]
name = "finrag-backend"
version = "0.1.0"
description = "FinRAG agent and API"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]
# Local embedding model + reranker (CPU torch). Install with: uv sync --group embed
embed = ["torch", "sentence-transformers>=3"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
